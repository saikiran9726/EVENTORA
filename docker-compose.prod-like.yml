# ========================================================
# EVENTORA STAGING & PROD-LIKE REHEARSAL ENVIRONMENT
# ========================================================
# Pool Sizing Math:
# 2 API instances × 20 pool_max = 40 connections
# 1 Worker instance × 10 pool_max = 10 connections
# Total = 50 < 100 max_connections - 10 reserved = 90 available
# ========================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventora"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    container_name: eventora-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eventora
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 60
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: eventora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    deploy:
      replicas: 2
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgrespassword@pgbouncer:6432/eventora
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: staging-production-like-cookie-secret-32-chars
      JWT_SECRET: staging-production-like-jwt-secret-32-chars
      PAYMENT_ADAPTER: simulator
      PAYMENT_WEBHOOK_SECRET: whsec_simulated_staging_key
      CORS_ORIGIN: http://localhost:8080
      METRICS_SECRET: internal-metrics-token-for-prometheus-scraper
      DB_POOL_MAX: 20
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@pgbouncer:6432/eventora
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: staging-production-like-cookie-secret-32-chars
      JWT_SECRET: staging-production-like-jwt-secret-32-chars
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=16m
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
